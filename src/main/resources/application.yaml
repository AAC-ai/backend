spring:
  application:
    name: aac-backend
  profiles:
    active: local
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-3-small
cors:
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000
  refresh-expiration-ms: 1209600000
