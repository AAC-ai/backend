spring:
  application:
    name: aac-backend
  profiles:
    active: local
  config:
    import:
      - config/jwt.yml
      - config/oidc.yml
      - config/openai.yml
      - config/db.yml
      - config/prompts.yml
      - config/conversation.yml
      - config/clova-voice.yml
  ai:
    openai:
      api-key: ${spring.ai.openai.api-key}
      chat:
        options:
          model: gpt-4o
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-3-small
jwt:
  secret: ${jwt.secret}
  expiration-ms: ${jwt.expiration-ms}
  refresh-expiration-ms: ${jwt.refresh-expiration-ms}

oidc:
  google:
    client-id: ${oidc.google.client-id}
    client-secret: ${oidc.google.client-secret}
    authorization-uri: ${oidc.google.authorization-uri}
    token-uri: ${oidc.google.token-uri}
    user-uri: ${oidc.google.user-uri}
    redirect-uri: ${oidc.google.redirect-uri}
    success-redirect-uri: ${oidc.google.success-redirect-uri}
    connect-timeout: ${oidc.google.connect-timeout}
    read-timeout: ${oidc.google.read-timeout}

prompts:
  sentence: ${prompts.sentence}
  sentence-single: ${prompts.sentence-single}

generation:
  summarizer-model: gpt-4o-mini
  sentence-max-completion-tokens: 64
  summarizer-max-completion-tokens: 120


cors:
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - https://aaco.kr
    - https://www.aaco.kr
